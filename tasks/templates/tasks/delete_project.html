<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Project | ProjectFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e8eaf0;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .25s;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 38px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(15, 23, 42, .08);
        }

        .icon {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            background: #fef2f2;
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .message {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .project-name {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 13px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 18px;
            word-break: break-word;
        }

        .warning {
            color: var(--danger);
            font-size: 12px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .cancel {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .cancel:hover {
            background: #e5e7eb;
        }

        .delete {
            background: var(--danger);
            color: white;
        }

        .delete:hover {
            background: var(--danger-dark);
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            🗑
        </div>

        <h1>
            Delete Project?
        </h1>

        <p class="message">
            Are you sure you want to delete this project?
        </p>

        <div class="project-name">
            {{ project.name }}
        </div>

        <p class="warning">
            This action cannot be undone.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <a href="{% url 'projects' %}" class="btn cancel">
                    Cancel
                </a>

                <button type="submit" class="btn delete">
                    Delete Project
                </button>

            </div>

        </form>

    </div>

</div>

<script>
    const savedTheme =
        localStorage.getItem("projectflow-theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark");
    }
</script>

</body>
</html>
