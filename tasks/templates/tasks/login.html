<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProjectFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e5e7eb;
            --input-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }

        body.dark {
            --bg: #0f172a;
            --card: #111827;
            --text: #f9fafb;
            --muted: #94a3b8;
            --border: #374151;
            --input-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .25s ease, color .25s ease;
            padding: 25px;
        }

        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .brand h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, .08);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 11px 12px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        body.dark .error {
            background: #3f1d1d;
            color: #fca5a5;
            border-color: #7f1d1d;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: var(--primary);
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            body {
                padding: 18px;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            .brand {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

<button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    title="Toggle dark/light mode"
>
    🌙
</button>

<div class="container">

    <div class="brand">

        <div class="logo">
            P
        </div>

        <h1>
            ProjectFlow
        </h1>

        <p>
            Simple project management
        </p>

    </div>

    <div class="card">

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Sign in to continue to your workspace.
        </p>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Sign In
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>

    </div>

</div>

<script>
    const themeToggle = document.getElementById("themeToggle");

    function updateThemeButton() {
        if (document.body.classList.contains("dark")) {
            themeToggle.textContent = "☀️";
            themeToggle.title = "Switch to light mode";
        } else {
            themeToggle.textContent = "🌙";
            themeToggle.title = "Switch to dark mode";
        }
    }

    const savedTheme = localStorage.getItem("projectflow-theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark");
    }

    updateThemeButton();

    themeToggle.addEventListener("click", function () {

        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
            localStorage.setItem("projectflow-theme", "dark");
        } else {
            localStorage.setItem("projectflow-theme", "light");
        }

        updateThemeButton();

    });
</script>

</body>
</html>
